aid: shapeci
name: ShapeCI
description: >-
  ShapeCI is software for industrials — a next-generation PDM (product data
  management) platform enabled by modern version control that helps hardware
  enterprises go from design to start of production in weeks rather than years.
  It brings a Git-style workflow to hardware and CAD: teams and projects hold
  design files under version control with merge requests, documents, and the
  ability to review 3D models in-browser and auto-sync engineering knowledge
  with the model-base. A desktop Connector application lets engineers clone a
  project, create workstreams, and publish or sync changes. ShapeCI is currently
  an invite-only beta and does not publish a public developer API; it was
  surfaced as a portfolio company of Bloomberg Beta and added to the API
  Evangelist network for enrichment.
